[package]
name = "ghcheck"
version = "0.1.0"
edition = "2021"
description = "Quick consolidated status of your personal GitHub PRs and CI"
authors = ["T.J. Greco <tgrecojr@gmail.com>"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "7", features = ["custom_styling"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
