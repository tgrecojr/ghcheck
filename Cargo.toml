[package]
name = "ghcheck"
version = "0.1.0"
edition = "2021"
description = "Quick consolidated status of your personal GitHub PRs and CI"
authors = ["T.J. Greco <tgrecojr@gmail.com>"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
owo-colors = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
