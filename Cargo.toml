[package]
name = "ghcheck"
version = "0.1.0"
edition = "2021"
description = "Quick consolidated status of your personal GitHub PRs and CI"
authors = ["T.J. Greco <tgrecojr@gmail.com>"]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = { version = "7.2.2", features = ["custom_styling"] }
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
lto = true
codegen-units = 1
strip = true
